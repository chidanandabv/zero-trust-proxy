networks:
  zero-trust-net:
    driver: bridge

services:

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --hostname=keycloak --hostname-strict=false --hostname-strict-https=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    networks:
      - zero-trust-net

  fileserver:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.fileserver
    ports:
      - "8082:8082"
    volumes:
      - ./files:/app/files
    networks:
      - zero-trust-net

  proxy:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.proxy
    ports:
      - "9090:9090"
    volumes:
      - ./certs:/app/certs
    depends_on:
      - keycloak
      - fileserver
    networks:
      - zero-trust-net

  user:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.user
    volumes:
      - ./certs:/app/certs
    depends_on:
      - keycloak
      - proxy
    networks:
      - zero-trust-net